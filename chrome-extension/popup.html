<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 260px;
        padding: 16px;
        font-family: 'Segoe UI', sans-serif;
        background: #1a1a1a;
        color: #f1f1f1;
        margin: 0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      .header-icon { color: #ff4444; font-size: 1.2rem; }
      .header-title { font-size: 1rem; font-weight: 700; }

      select, input {
        width: 100%;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 6px;
        color: #f1f1f1;
        padding: 7px 10px;
        font-size: 0.82rem;
        margin-bottom: 8px;
        box-sizing: border-box;
      }

      #save-btn {
        width: 100%;
        padding: 10px;
        background: #ff4444;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 600;
        margin-top: 4px;
      }
      #save-btn:hover { background: #cc0000; }
      #save-btn:disabled { background: #555; cursor: not-allowed; }

      #status {
        margin-top: 10px;
        font-size: 0.78rem;
        color: #aaa;
        min-height: 18px;
        text-align: center;
      }
      #status.success { color: #4caf50; }
      #status.error   { color: #ff4444; }

      label {
        font-size: 0.75rem;
        color: #888;
        display: block;
        margin-bottom: 3px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="header-icon">▶</span>
      <span class="header-title">VideoMark</span>
    </div>

    <label>Status</label>
    <select id="status-select">
      <option value="Watching">Watching</option>
      <option value="Not Started">Not Started</option>
      <option value="Completed">Completed</option>
    </select>

    <label>Folder (optional)</label>
    <input type="text" id="folder-input" placeholder="e.g. React, DBMS..." />

    <button id="save-btn">Save Current Timestamp</button>
    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
